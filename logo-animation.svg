  <path class="petal-tl" d="M94.1683 156.526C93.224 157.659 92.2797 158.792 91.3354 159.925C88.68 160.016 86.0813 160.039 83.5392 159.994C60.6604 159.589 42.3709 153.678 28.6706 142.26C14.9704 130.842 5.85945 113.917 1.33783 91.486C0.835411 88.9936 0.389691 86.4333 0.000586388 83.805C0.944889 82.6719 1.88918 81.5389 2.83349 80.4058C5.4889 80.3149 8.08763 80.2918 10.6297 80.3368C33.5085 80.7417 51.7981 86.6531 65.4983 98.0711C79.1985 109.489 88.3095 126.414 92.8311 148.845C93.3335 151.337 93.7793 153.898 94.1683 156.526Z" fill="url(#paint8_linear_486_723)"/>

