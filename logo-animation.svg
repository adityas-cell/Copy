<svg width="889" height="881" viewBox="0 0 889 881" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ---- Nexus animated logo (self-contained SVG) ----
       Build-in plays once and settles; the dashed ring rotates forever.
       The triangle "spin" is a 2D horizontal flip (scaleX) — the pure-SVG
       stand-in for the video's 3D rotateY. */

    .sphere, .triangle, .rings, .vline,
    .petal-tl, .petal-tr, .petal-bt {
      transform-box: fill-box;
      animation-duration: 9s;
      animation-iteration-count: 1;
      animation-fill-mode: both;
    }

    /* 1 — centre sphere pops in */
    .sphere {
      transform-origin: center;
      animation-name: sphereIn;
      animation-timing-function: cubic-bezier(.2,.8,.25,1);
    }
    @keyframes sphereIn {
      0%   { opacity: 0; transform: scale(0); }
      4.5% { opacity: 1; transform: scale(1.08); }
      6%   { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 2+3 — triangle scales in, then flips (flatten to a line and back) */
    .triangle {
      transform-origin: center;
      animation-name: triFlip;
      animation-timing-function: cubic-bezier(.45,0,.25,1);
    }
    @keyframes triFlip {
      0%     { opacity: 0; transform: scale(.15); }
      5.6%   { opacity: 0; transform: scale(.15); }
      15.6%  { opacity: 1; transform: scaleX(1) scaleY(1); }
      22.3%  { opacity: 1; transform: scaleX(0) scaleY(1); }
      29%    { opacity: 1; transform: scaleX(1) scaleY(1); }
      100%   { opacity: 1; transform: scaleX(1) scaleY(1); }
    }

    /* 3b — solid ring fades in */
    .rings {
      animation-name: ringsIn;
      animation-timing-function: ease-out;
    }
    @keyframes ringsIn {
      0%   { opacity: 0; }
      22%  { opacity: 0; }
      33%  { opacity: .8; }
      100% { opacity: .8; }
    }

    /* dashed ring — fades in with the others, then rotates FOREVER */
    .ring-dashed {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        ringsIn 9s ease-out 1 both,       /* one-shot fade-in */
        dashSpin 22s linear infinite;     /* perpetual rotation */
    }
    @keyframes dashSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* 4 — vertical centre line draws top -> bottom */
    .vline {
      stroke-dasharray: 706;
      animation-name: lineDraw;
      animation-timing-function: cubic-bezier(.5,0,.2,1);
    }
    @keyframes lineDraw {
      0%   { stroke-dashoffset: 706; }
      29%  { stroke-dashoffset: 706; }
      40%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }

    /* 5 — three petals pop in at the triangle corners (staggered) */
    .petal-tl { transform-origin: 100% 50%; animation-name: petalTL; animation-timing-function: cubic-bezier(.2,.9,.25,1.2); }
    .petal-tr { transform-origin: 0%   50%; animation-name: petalTR; animation-timing-function: cubic-bezier(.2,.9,.25,1.2); }
    .petal-bt { transform-origin: 50%  0%;  animation-name: petalBT; animation-timing-function: cubic-bezier(.2,.9,.25,1.2); }
    @keyframes petalTL {
      0%   { opacity: 0; transform: scale(0); }
      39%  { opacity: 0; transform: scale(0); }
      45%  { opacity: 1; transform: scale(1.15); }
      48%  { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes petalTR {
      0%   { opacity: 0; transform: scale(0); }
      42%  { opacity: 0; transform: scale(0); }
      48%  { opacity: 1; transform: scale(1.15); }
      51%  { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes petalBT {
      0%   { opacity: 0; transform: scale(0); }
      44%  { opacity: 0; transform: scale(0); }
      50%  { opacity: 1; transform: scale(1.15); }
      53%  { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- solid ring : fades in -->
  <g class="rings">
    <g opacity="0.8" filter="url(#filter0_dd_486_723)">
      <circle cx="440.846" cy="374.754" r="319.803" stroke="url(#paint0_linear_486_723)" stroke-width="2" shape-rendering="crispEdges"/>
    </g>
  </g>

  <!-- dashed ring : fades in, then rotates continuously -->
  <g class="ring-dashed" opacity="0.8" filter="url(#filter1_dd_486_723)">
    <circle cx="440.851" cy="379.177" r="350.777" stroke="url(#paint1_linear_486_723)" stroke-width="2" stroke-dasharray="8.85 8.85" shape-rendering="crispEdges"/>
  </g>

  <!-- inverted triangle : scales in, then flips -->
  <g class="triangle" filter="url(#filter2_dd_486_723)">
    <path d="M443.066 766.352L89.0752 155.721L799.266 155.72L443.066 766.352Z" fill="white"/>
    <path d="M90.8115 156.721L797.524 156.721L443.07 764.363L90.8115 156.721Z" stroke="url(#paint2_linear_486_723)" stroke-width="2"/>
