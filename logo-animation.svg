  <!-- vertical centre line : draws top to bottom -->
  <line class="vline" x1="442.66" y1="58.4004" x2="442.66" y2="764.4" stroke="url(#paint3_linear_486_723)" stroke-width="3"/>

  <!-- centre sphere : pops in first -->
  <circle class="sphere" cx="436.428" cy="374.752" r="94.1345" fill="url(#paint4_linear_486_723)" stroke="url(#paint5_linear_486_723)" stroke-width="2"/>

